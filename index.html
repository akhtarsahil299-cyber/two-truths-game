<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2F4CFF">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Two truths and a lie | Made by Sahil Akhtar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10172E; --blue:#2F4CFF; --deep:#2038D6; --sun:#FFD43B;
  --coral:#FF5C7A; --mint:#1FBF8F; --paper:#FFFBF0; --mute:#6B7390;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--blue); color:var(--ink);
  font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  font-size:17px; line-height:1.4;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
#app{max-width:520px;margin:0 auto;padding:60px 18px 90px}
h1{font-size:clamp(40px,12vw,60px);line-height:.95;margin:8px 0 12px;color:var(--paper);font-weight:800;letter-spacing:-.02em}
h2{font-size:26px;margin:0 0 6px;font-weight:800;color:var(--paper);letter-spacing:-.01em}
.sub{color:#DCE3FF;margin:0 0 22px}
.panel{background:var(--paper);border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 6px 0 var(--deep)}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text]{
  width:100%;font:inherit;padding:13px 14px;border-radius:14px;
  border:2px solid var(--ink);background:#fff;color:var(--ink);
}
input[type=text]:focus{outline:3px solid var(--sun);outline-offset:1px}
button{
  font:inherit;font-weight:800;cursor:pointer;border:2px solid var(--ink);
  background:var(--sun);color:var(--ink);padding:13px 18px;border-radius:14px;
  box-shadow:0 4px 0 var(--ink);transition:transform .08s, box-shadow .08s;width:100%;
}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:var(--paper)}
button.small{width:auto;padding:8px 14px;font-size:15px}
.gap{margin-top:14px}
.or{text-align:center;color:var(--mute);margin:16px 0}
.err{background:var(--coral);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.code{font-size:64px;font-weight:800;letter-spacing:.14em;text-align:center;margin:4px 0 2px;color:var(--ink)}
.hint{color:var(--mute);text-align:center;margin:0 0 14px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 13px;font-weight:600;font-size:16px}
.chip.host{background:var(--sun)}
.chip.done{background:var(--mint);color:#fff;border-color:var(--ink)}

/* statement cards: tilted like a hand of playing cards */
.cards{display:flex;flex-direction:column;gap:14px;margin:18px 0}
.card{
  position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:18px;
  padding:18px 18px 18px 18px;text-align:left;font:inherit;font-weight:600;color:var(--ink);
  box-shadow:0 5px 0 var(--ink);width:100%;
}
.card:nth-child(1){transform:rotate(-1.4deg)}
.card:nth-child(2){transform:rotate(.9deg)}
.card:nth-child(3){transform:rotate(-.6deg)}
button.card:not(:disabled):hover{background:#fff}
button.card:active:not(:disabled){box-shadow:0 2px 0 var(--ink)}
.card.picked{background:var(--sun)}
.card.truth{background:#D8F7EA}
.card.lie{background:#FFE0E6}
.card .tag{
  display:inline-block;margin-top:10px;padding:3px 12px;border-radius:999px;
  font-weight:800;font-size:14px;border:2px solid var(--ink);background:#fff;
}
.card.lie .tag{background:var(--coral);color:#fff}
.card.truth .tag{background:var(--mint);color:#fff}
.card .who{display:block;margin-top:8px;font-size:15px;font-weight:400;color:var(--mute)}
.stamp{
  position:absolute;right:10px;top:-14px;transform:rotate(8deg);
  background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:10px;
  padding:2px 14px;font-weight:800;font-size:22px;
  animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes stamp{from{transform:rotate(8deg) scale(2.6);opacity:0}to{transform:rotate(8deg) scale(1);opacity:1}}

/* writing form */
.write{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.write .row{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:12px}
.write .row.islie{background:#FFE0E6}
.write .row input[type=text]{border:none;padding:4px 2px;background:transparent}
.write .row input[type=text]:focus{outline:none}
.write .row:focus-within{outline:3px solid var(--sun)}
.write .lie-pick{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px;font-weight:600;cursor:pointer}
.write .lie-pick input{width:20px;height:20px;accent-color:var(--coral)}

.board{list-style:none;margin:0;padding:0}
.board li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:2px dashed #D9D3BE;font-weight:600}
.board li:last-child{border-bottom:none}
.board .gain{color:var(--mint);margin-left:8px}
.pill{display:inline-block;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600}
.logo{margin:6px 0 14px;font-size:clamp(46px,14vw,68px);line-height:.9;font-weight:800;letter-spacing:-.03em;color:var(--paper)}
.logo .hl{display:inline-block;background:var(--sun);color:var(--ink);padding:2px 12px 6px;border:3px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);rotate:-2deg}
.logo .l2{display:flex;align-items:center;gap:14px;margin-top:14px}
.logo .amp{font-weight:600;color:#DCE3FF}
.logo .lie{display:inline-block;background:var(--coral);color:#fff;padding:2px 16px 6px;border:3px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);rotate:3deg;animation:slam .5s .15s cubic-bezier(.2,1.6,.4,1) both}
.byline{display:inline-flex;align-items:center;gap:9px;margin:2px 0 14px;padding:5px 15px 5px 5px;border-radius:999px;background:rgba(255,255,255,.15);font-size:15px;font-weight:600;color:#fff}
.byline b{color:var(--sun);font-weight:800}
.byline .mono{width:28px;height:28px;border-radius:50%;background:var(--sun);color:var(--ink);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:0}
@media (prefers-reduced-motion:reduce){.logo .lie{animation:none}}
.brand{text-align:center;color:#DCE3FF;font-size:14px;margin-top:26px}
.brand b{color:var(--sun)}
.progress{color:#DCE3FF;margin:0 0 4px;font-weight:600}
.big{font-size:22px;font-weight:800;margin:0 0 6px}
.winner{font-size:34px;font-weight:800;margin:4px 0 14px;line-height:1.05}


.hidden{display:none!important}
.steps{list-style:none;counter-reset:st;margin:8px 0 0;padding:0}
.steps li{counter-increment:st;position:relative;padding:4px 0 12px 46px;font-size:16px}
.steps li::before{content:counter(st);position:absolute;left:0;top:2px;width:34px;height:34px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);font-weight:800;display:flex;align-items:center;justify-content:center}
.steps li:nth-child(2)::before{background:#9BE8CC}.steps li:nth-child(3)::before{background:#FFB3C1}.steps li:nth-child(4)::before{background:#B9C4FF}
.steps li:last-child{padding-bottom:2px}
.wcards{display:flex;flex-direction:column;gap:16px;margin:6px 0 16px}
.wcard{border:3px solid var(--ink);border-radius:20px;padding:14px 16px 12px;box-shadow:0 5px 0 var(--ink);animation:rise .4s both}
.wcard.truth{background:#D8F7EA}.wcard.lie{background:#FFE0E6}
.wcard:nth-child(1){transform:rotate(-1deg)}.wcard:nth-child(2){transform:rotate(.8deg);animation-delay:.08s}.wcard:nth-child(3){transform:rotate(-.6deg);animation-delay:.16s}
.wtag{display:inline-block;font-weight:800;font-size:14px;padding:3px 12px;border-radius:999px;border:2px solid var(--ink);background:var(--mint);color:#fff}
.wcard.lie .wtag{background:var(--coral)}
.wcard input[type=text]{border:none;background:transparent;font-size:19px;font-weight:600;padding:10px 0 4px;border-bottom:2px dashed rgba(16,23,46,.3);border-radius:0}
.wcard input[type=text]:focus{outline:none;border-bottom-color:var(--ink)}
.whint{font-size:14px;color:var(--mute);margin-top:6px}
.tip{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;color:#fff;font-size:15px;margin-bottom:14px}
@keyframes rise{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
#chatbtn{position:fixed;z-index:8;right:12px;bottom:max(14px,env(safe-area-inset-bottom));width:auto;padding:10px 16px;background:var(--paper)}
#badge{display:inline-block;min-width:22px;margin-left:8px;padding:0 6px;border-radius:999px;background:var(--coral);color:#fff;font-size:13px;line-height:22px}
#badge:empty{display:none}
#chat{position:fixed;z-index:9;right:10px;bottom:0;width:min(370px,calc(100% - 20px));height:min(62vh,430px);background:var(--paper);border:3px solid var(--ink);border-bottom:none;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -4px 0 rgba(16,23,46,.25)}
#chat header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:800;border-bottom:2px dashed #D9D3BE}
#msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y}
.m{max-width:85%;align-self:flex-start;background:#fff;border:2px solid var(--ink);border-radius:14px 14px 14px 4px;padding:6px 10px;font-size:16px;word-break:break-word}
.m b{display:block;font-size:12px;color:var(--mute)}
.m.me{align-self:flex-end;background:var(--sun);border-radius:14px 14px 4px 14px}.m.me b{display:none}
.quick{display:flex;gap:6px;padding:6px 12px 0}.quick button{width:auto;padding:4px 10px;font-size:18px;box-shadow:0 2px 0 var(--ink);background:#fff}
.cin{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}.cin input{flex:1}.cin button{width:auto}
@media (prefers-reduced-motion:reduce){.wcard{animation:none}}

.demo{padding:0;overflow:hidden}
.demohead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:var(--ink);color:var(--paper);font-weight:800;font-size:15px}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mint);margin-right:8px;animation:pulse 1.4s infinite}
#cap{font-weight:600;font-size:13px;color:var(--sun);text-align:right}
.demobody{height:330px;overflow:hidden;padding:12px;display:flex;flex-direction:column;gap:8px;background:#F3EFE0}
.dm{display:flex;gap:8px;align-items:flex-end;animation:pop .3s both}
.av{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.bub{position:relative;background:#fff;border:2px solid var(--ink);border-radius:14px 14px 14px 4px;padding:7px 11px;font-size:15px;transition:background .3s}
.bub small{font-weight:800;margin-right:6px;color:var(--mute)}
.bub.dcard{background:var(--paper)}.bub.dcard.lie{background:#FFE0E6}
.dstamp{position:absolute;right:-4px;top:-13px;rotate:8deg;background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 9px;font-weight:800;font-size:15px;animation:slam .35s cubic-bezier(.2,1.6,.4,1) both}
.dsc{align-self:center;background:var(--mint);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;font-weight:800;font-size:14px;animation:pop .3s both}
.tdots{display:inline-flex;gap:4px;padding:10px 12px}.tdots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:blink 1s infinite}
.tdots i:nth-child(2){animation-delay:.15s}.tdots i:nth-child(3){animation-delay:.3s}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes slam{from{scale:2.6;opacity:0}to{scale:1;opacity:1}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dm,.dsc,.dstamp,.live,.tdots i{animation:none}}
#snd{position:fixed;z-index:9;top:max(10px,env(safe-area-inset-top));right:10px;width:auto;padding:6px 12px;font-size:13px;background:rgba(255,251,240,.92);box-shadow:0 3px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}button{transition:none}}
</style>
</head>
<body>
<button id="snd" aria-pressed="true">Sound on</button>
<div id="app"></div>
<button id="chatbtn" class="hidden" aria-label="Open chat">Chat<span id="badge"></span></button>
<div id="chat" class="hidden" role="dialog" aria-label="Room chat">
  <header>Room chat <button class="small ghost" id="cclose" aria-label="Close chat">Close</button></header>
  <div id="msgs" aria-live="polite"></div>
  <div class="quick"><button data-e="😂" aria-label="laugh">😂</button><button data-e="😱" aria-label="shock">😱</button><button data-e="🤔" aria-label="think">🤔</button><button data-e="👏" aria-label="clap">👏</button><button data-e="🔥" aria-label="fire">🔥</button></div>
  <div class="cin"><input type="text" id="cin" maxlength="200" placeholder="Say something..." autocomplete="off" aria-label="Chat message"><button id="csend">Send</button></div>
</div>
<div class="brand">Made by <b>Sahil Akhtar</b></div>

<script>
const app = document.getElementById('app');
let session = null;
try { session = JSON.parse(localStorage.getItem('ttl-session') || 'null'); } catch (e) {}
let S = null;                 // latest server state
let renderedKey = null;       // avoids re-rendering (and stealing focus) while typing
let draft = { s: ['', '', ''], lie: null };
let error = '';
let busy = false;

const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, body) {
  const opt = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Something went wrong. Try again.'); e.status = r.status; throw e; }
  return j;
}

async function act(type, extra = {}) {
  if (busy) return;
  busy = true; error = '';
  try {
    await api('/api/action', { type, code: session.code, pid: session.pid, ...extra });
    await poll(true);
  } catch (e) { error = e.message; renderedKey = null; render(); }
  busy = false;
}

function saveSession(s) { session = s; localStorage.setItem('ttl-session', JSON.stringify(s)); }
function leave() {
  chatSync(null);
  session = null; S = null; renderedKey = null; draft = { s: ['', '', ''], lie: null };
  localStorage.removeItem('ttl-session'); render();
}

async function poll(force) {
  if (!session) return;
  try {
    const s = await api(`/api/state?code=${session.code}&pid=${session.pid}`);
    const prevPhase = S && S.phase;
    sfx.onState(S, s);
    S = s;
    chatSync(s);
    if (prevPhase === 'lobby' && s.phase === 'writing') draft = { s: ['', '', ''], lie: null };
    const key = (s.phase === 'writing' && !s.submitted) ? 'writing-form' : `${s.phase}-${s.v}`;
    if (force || key !== renderedKey) { renderedKey = key; render(); }
  } catch (e) {
    if (e.status === 404) { error = 'That room is gone. Start a new one.'; leave(); }
  }
}

/* ---------- sound effects (synthesised with Web Audio, no files needed) ---------- */
const sfx = (() => {
  let ac, on = localStorage.getItem('ttl-mute') !== '1';
  const ctx = () => { if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ac = new A(); } if (ac.state === 'suspended') ac.resume(); return ac; };
  function tone(f, at, dur, type = 'sine', vol = .14, to) {
    const a = ctx(); if (!a || !on) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
  }
  const seq = (notes, step, dur, type, vol) => notes.forEach((n, i) => tone(n, i * step, dur, type, vol));
  const S = {
    tap: () => tone(520, 0, .07, 'triangle', .1),
    lock: () => { tone(440, 0, .07, 'triangle', .13); tone(660, .07, .12, 'triangle', .13); },
    join: () => { tone(660, 0, .08, 'sine', .12); tone(990, .08, .14, 'sine', .12); },
    ready: () => tone(740, 0, .09, 'triangle', .08),
    start: () => tone(250, 0, .4, 'sawtooth', .07, 900),
    round: () => seq([523, 659, 784], .09, .16, 'triangle', .12),
    drum: () => { for (let i = 0; i < 11; i++) tone(170, i * (.085 - i * .004), .07, 'sine', .22, 70); },
    stamp: () => { tone(95, .9, .3, 'sine', .45, 38); tone(240, .9, .08, 'square', .12, 80); },
    win: () => seq([523, 659, 784, 1047], .09, .2, 'triangle', .14),
    lose: () => { tone(330, 0, .22, 'sawtooth', .09, 250); tone(262, .22, .4, 'sawtooth', .09, 120); },
    sneaky: () => seq([392, 330, 392, 330, 392], .11, .12, 'square', .07),
    final: () => { seq([523, 523, 523, 659, 784], .13, .22, 'triangle', .14); tone(1047, .7, .8, 'triangle', .14); }
  };
  const play = n => { try { S[n](); } catch (e) {} };
  function onState(a, b) {
    if (!a || a.code !== b.code) return;
    if (b.phase === 'lobby' && b.players.length > a.players.length) return play('join');
    if (a.phase === 'lobby' && b.phase === 'writing') return play('start');
    if (b.phase === 'writing' && a.phase === 'writing' && b.players.filter(p => p.submitted).length > a.players.filter(p => p.submitted).length) return play('ready');
    if (b.phase === 'voting' && (a.phase === 'writing' || a.phase === 'reveal')) return play('round');
    if (b.phase === 'reveal' && a.phase === 'voting') {
      play('drum'); play('stamp');
      const r = b.round, meName = (b.players.find(p => p.id === b.you) || {}).name;
      const gained = (r.gains || []).some(g => g.name === meName);
      const after = r.presenterId === b.you ? (gained ? 'sneaky' : 'lose') : (r.myVote === r.lie ? 'win' : 'lose');
      setTimeout(() => play(after), 1250);
      return;
    }
    if (b.phase === 'final' && a.phase !== 'final') return play('final');
  }
  const btn = document.getElementById('snd');
  const label = () => { btn.textContent = on ? 'Sound on' : 'Sound off'; btn.setAttribute('aria-pressed', on); };
  btn.onclick = () => { on = !on; localStorage.setItem('ttl-mute', on ? '0' : '1'); label(); if (on) play('tap'); };
  label();
  document.addEventListener('pointerdown', ctx, { once: true });
  document.addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.id !== 'snd' && !b.classList.contains('card')) play('tap'); });
  return { onState, lock: () => play('lock'), ping: () => play('ready') };
})();

/* ---------- chat ---------- */
let cn = -1, unread = 0, chatOpen = false;
const $c = id => document.getElementById(id);
function setBadge() { $c('badge').textContent = unread ? unread : ''; }
function chatSync(s) {
  if (!s) { $c('chatbtn').classList.add('hidden'); $c('chat').classList.add('hidden'); chatOpen = false; cn = -1; unread = 0; setBadge(); return; }
  if (!chatOpen) $c('chatbtn').classList.remove('hidden');
  if (s.cn === cn) return;
  const first = cn === -1; cn = s.cn;
  const box = $c('msgs'); box.textContent = '';
  s.chat.forEach(m => { const d = document.createElement('div'), n = document.createElement('b'), t = document.createElement('span'); d.className = 'm' + (m.me ? ' me' : ''); n.textContent = m.name; t.textContent = m.text; d.append(n, t); box.append(d); });
  box.scrollTop = box.scrollHeight;
  const last = s.chat[s.chat.length - 1];
  if (!first && last && !last.me && !chatOpen) { unread++; setBadge(); sfx.ping(); }
}
async function sendChat(text) {
  text = (text || '').trim(); if (!text || !session) return;
  try { await api('/api/action', { type: 'chat', code: session.code, pid: session.pid, text }); } catch (e) {}
  $c('cin').value = ''; poll(false);
}
$c('chatbtn').onclick = () => { chatOpen = true; unread = 0; setBadge(); $c('chat').classList.remove('hidden'); $c('chatbtn').classList.add('hidden'); $c('msgs').scrollTop = 1e6; $c('cin').focus(); };
$c('cclose').onclick = () => { chatOpen = false; $c('chat').classList.add('hidden'); $c('chatbtn').classList.remove('hidden'); };
$c('csend').onclick = () => sendChat($c('cin').value);
$c('cin').onkeydown = e => { if (e.key === 'Enter') sendChat($c('cin').value); };
document.querySelectorAll('.quick button').forEach(b => b.onclick = () => sendChat(b.dataset.e));

/* ---------- screens ---------- */
function render() {
  if (!session || !S) return renderHome();
  const fn = { lobby: renderLobby, writing: renderWriting, voting: renderRound, reveal: renderRound, final: renderFinal }[S.phase];
  fn();
}

function errBox() { return error ? `<div class="err" role="alert">${esc(error)}</div>` : ''; }

/* ---------- animated chat demo on the start page ---------- */
function runDemo() {
  const box = document.getElementById('demo'), cap = document.getElementById('cap');
  if (!box) return;
  const rm = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const alive = () => document.body.contains(box);
  const go = async ms => { await new Promise(r => setTimeout(r, rm ? 0 : ms)); if (!alive()) throw 0; };
  const who = { R: ['Sana', '#FFD43B'], A: ['Aman', '#9BE8CC'], Z: ['Nida', '#FFB3C1'] };
  const row = (k, inner) => {
    const d = document.createElement('div'), av = document.createElement('span');
    d.className = 'dm'; av.className = 'av'; av.style.background = who[k][1]; av.textContent = who[k][0][0]; av.title = who[k][0];
    d.append(av, inner); box.append(d); box.scrollTop = box.scrollHeight; return d;
  };
  const bubble = (text, tag, cls = '') => {
    const b = document.createElement('div'); b.className = 'bub ' + cls;
    if (tag) { const t = document.createElement('small'); t.textContent = tag; b.append(t); }
    b.append(document.createTextNode(text)); return b;
  };
  const typing = async (k, ms = 750) => {
    const t = document.createElement('div'); t.className = 'bub tdots'; t.innerHTML = '<i></i><i></i><i></i>';
    const r = row(k, t); await go(ms); r.remove();
  };
  (async () => {
    try {
      do {
        box.textContent = '';
        cap.textContent = '1. Write two truths and one lie';
        await go(700);
        const cards = [];
        for (const [i, text] of ['I have met a famous cricketer', 'I can solve a Rubik\u2019s cube in a minute', 'I have never tasted pizza'].entries()) {
          await typing('R'); const b = bubble(text, '#' + (i + 1), 'dcard'); row('R', b); cards.push(b); await go(450);
        }
        cap.textContent = '2. Friends guess which one is fake';
        await go(500);
        await typing('A'); row('A', bubble('I think #2 is the lie')); await go(700);
        await typing('Z'); row('Z', bubble('Easy, it is #3!')); await go(1100);
        cap.textContent = '3. The lie is revealed and points are won';
        cards[2].classList.add('lie');
        const st = document.createElement('span'); st.className = 'dstamp'; st.textContent = 'LIE'; cards[2].append(st);
        await go(900);
        const sc = document.createElement('div'); sc.className = 'dsc'; sc.textContent = 'Nida +100   Sana +100'; box.append(sc); box.scrollTop = box.scrollHeight;
        await go(3800);
      } while (!rm);
    } catch (e) { /* page changed, stop */ }
  })();
}

function renderHome() {
  const prefill = new URLSearchParams(location.search).get('room') || '';
  app.innerHTML = `
    <h1 class="logo"><span class="hl">Two Truths</span><span class="l2"><span class="amp">&amp; a</span><span class="lie">LIE</span></span></h1>
    <div class="byline"><span class="mono" aria-hidden="true">SA</span><span>Made by <b>Sahil Akhtar</b></span></div>
    <p class="sub">The party game where your friends find out who is the best liar.</p>
    ${errBox()}
    <div class="panel">
      <label for="name">Your name</label>
      <input id="name" type="text" maxlength="16" autocomplete="off" placeholder="Sahil">
      <button class="gap" id="create">Start a room</button>
      <div class="or">or join your friends</div>
      <label for="code">Room code</label>
      <input id="code" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="${esc(prefill.toUpperCase())}">
      <button class="gap ghost" id="join">Join room</button>
    </div>
    <div class="panel demo" aria-hidden="true">
      <div class="demohead"><span><span class="live"></span>Sana’s room</span><span id="cap"></span></div>
      <div class="demobody" id="demo"></div>
    </div>
    <div class="panel">
      <p class="big">How to play</p>
      <ol class="steps">
        <li><b>Gather friends.</b> One person starts a room. Everyone else joins with the 4-letter code. You need 3 to 12 players.</li>
        <li><b>Write 3 cards.</b> Two things that are true about you and one believable lie.</li>
        <li><b>Spot the lie.</b> One by one, a player's cards appear. Everyone else taps the card they think is fake.</li>
        <li><b>Win points.</b> Find the lie and get +100. Fool a friend and get +100 for each one you fool. Most points wins.</li>
      </ol>
    </div>`;
  const name = document.getElementById('name');
  name.value = localStorage.getItem('ttl-name') || '';
  const go = async (type) => {
    error = '';
    try {
      localStorage.setItem('ttl-name', name.value);
      const res = await api('/api/action', { type, name: name.value, code: document.getElementById('code').value });
      saveSession({ code: res.code, pid: res.pid });
      history.replaceState(null, '', location.pathname);
      renderedKey = null; await poll(true);
    } catch (e) { error = e.message; renderHome(); }
  };
  document.getElementById('create').onclick = () => go('create');
  document.getElementById('join').onclick = () => go('join');
  runDemo();
}

function renderLobby() {
  const link = `${location.origin}${location.pathname}?room=${S.code}`;
  const enough = S.players.length >= 3;
  app.innerHTML = `
    <h2>Waiting for friends</h2>
    <p class="sub">Share this code or link. Everyone needs a phone or laptop.</p>
    ${errBox()}
    <div class="panel">
      <div class="code">${esc(S.code)}</div>
      <p class="hint">${esc(link)}</p>
      <button class="ghost" id="copy">Copy invite link</button>
    </div>
    <div class="panel">
      <p class="big">${S.players.length} in the room</p>
      <div class="chips">${S.players.map(p => `<span class="chip ${p.isHost ? 'host' : ''}">${esc(p.name)}${p.id === S.you ? ' (you)' : ''}</span>`).join('')}</div>
    </div>
    ${S.isHost
      ? `<button id="start" ${enough ? '' : 'disabled'}>${enough ? 'Start the game' : 'Need 3 players to start'}</button>`
      : `<p class="sub">The host will start the game.</p>`}
    <button class="ghost small gap" id="leave">Leave room</button>`;
  document.getElementById('copy').onclick = async (e) => {
    try { await navigator.clipboard.writeText(link); e.target.textContent = 'Link copied'; }
    catch { e.target.textContent = 'Copy it from above'; }
  };
  const st = document.getElementById('start'); if (st) st.onclick = () => act('start');
  document.getElementById('leave').onclick = leave;
}

function renderWriting() {
  if (S.submitted) {
    const waiting = S.players.filter(p => !p.submitted);
    const ready = S.players.length - waiting.length;
    app.innerHTML = `
      <h2>Cards are in</h2>
      <p class="sub">Waiting for ${waiting.length} ${waiting.length === 1 ? 'friend' : 'friends'} to finish.</p>
      ${errBox()}
      <div class="panel">
        <div class="chips">${S.players.map(p => `<span class="chip ${p.submitted ? 'done' : ''}">${esc(p.name)}</span>`).join('')}</div>
      </div>
      ${S.isHost && ready >= 2 && waiting.length ? `<button id="begin">Start with ${ready} players ready</button>` : ''}`;
    const b = document.getElementById('begin'); if (b) b.onclick = () => act('begin');
    return;
  }
  const F = [['truth', 'Truth #1', 'Something real, like "I have been on a plane 20 times"'], ['truth', 'Truth #2', 'Another real one. Surprising is better.'], ['lie', 'Your lie', 'Make it sound just as believable as the truths.']];
  const rows = F.map(([cls, title, hint], i) => `
    <div class="wcard ${cls}"><span class="wtag">${title}</span>
      <input type="text" maxlength="120" data-i="${i}" autocomplete="off" placeholder="Type it here..." value="${esc(draft.s[i])}" aria-label="${title}">
      <div class="whint">${hint}</div></div>`).join('');
  app.innerHTML = `
    <h2>Write your three cards</h2>
    <p class="sub">Two truths and one lie. Friends see them mixed up, so nobody can guess by position.</p>
    ${errBox()}
    <div class="tip">Tip: the best lies sound boring and the best truths sound wild.</div>
    <div class="wcards">${rows}</div>
    <button id="submit">Lock in my cards</button>`;
  app.querySelectorAll('input[type=text]').forEach(inp => inp.oninput = () => { draft.s[+inp.dataset.i] = inp.value; });
  document.getElementById('submit').onclick = () => act('submit', { statements: draft.s, lie: 2 });
}

function scoreboard(withGains) {
  const gains = {};
  if (withGains && S.round && S.round.gains) S.round.gains.forEach(g => gains[g.name] = g.points);
  const sorted = [...S.players].sort((a, b) => b.score - a.score);
  return `<ul class="board">${sorted.map(p => `
    <li><span>${esc(p.name)}</span><span>${p.score}${gains[p.name] ? `<span class="gain">+${gains[p.name]}</span>` : ''}</span></li>`).join('')}</ul>`;
}

function renderRound() {
  const r = S.round;
  const mine = r.presenterId === S.you;
  const revealed = S.phase === 'reveal';
  const head = `<p class="progress">Round ${r.index} of ${r.total}</p>
    <h2>${mine ? 'Your cards are up' : `${esc(r.presenterName)}'s cards`}</h2>`;

  let cards;
  if (revealed) {
    cards = r.statements.map((t, i) => {
      const isLie = i === r.lie;
      const names = r.tally[i];
      return `<div class="card ${isLie ? 'lie' : 'truth'}">
        ${isLie ? '<span class="stamp">LIE</span>' : ''}
        ${esc(t)}
        <span class="tag">${isLie ? 'The lie' : 'True'}</span>
        <span class="who">${names.length ? `Picked by ${names.map(esc).join(', ')}` : 'Nobody picked this'}</span>
      </div>`;
    }).join('');
  } else {
    cards = r.statements.map((t, i) => {
      if (mine) return `<div class="card">${esc(t)}</div>`;
      const picked = r.myVote === i;
      return `<button class="card ${picked ? 'picked' : ''}" data-i="${i}" ${r.myVote != null ? 'disabled' : ''}>${esc(t)}${picked ? '<span class="tag">Your guess</span>' : ''}</button>`;
    }).join('');
  }

  let status = '';
  if (!revealed) {
    const left = r.eligible - r.voted;
    status = mine ? `<p class="sub">Keep a straight face. ${left} still guessing.</p>`
      : r.myVote != null ? `<p class="sub">Locked in. Waiting for ${left} more.</p>`
      : `<p class="sub">Tap the statement you think is the lie.</p>`;
  }

  let actions = '';
  if (S.isHost && !revealed) actions = `<button id="reveal" class="ghost">Reveal now</button>`;
  if (S.isHost && revealed) actions = `<button id="next">${r.index === r.total ? 'See final scores' : 'Next round'}</button>`;

  app.innerHTML = `${head}${errBox()}${status}<div class="cards">${cards}</div>${actions}
    <div class="panel gap"><p class="big">Scores</p>${scoreboard(revealed)}</div>
    ${!S.isHost && revealed ? '<p class="sub">Waiting for the host to continue.</p>' : ''}`;

  app.querySelectorAll('button.card').forEach(b => b.onclick = () => { sfx.lock(); act('vote', { choice: +b.dataset.i }); });
  const rv = document.getElementById('reveal'); if (rv) rv.onclick = () => act('reveal');
  const nx = document.getElementById('next'); if (nx) nx.onclick = () => act('next');
}

function renderFinal() {
  const sorted = [...S.players].sort((a, b) => b.score - a.score);
  const top = sorted[0].score;
  const winners = sorted.filter(p => p.score === top).map(p => p.name);
  app.innerHTML = `
    <p class="progress">Game over</p>
    <h1 style="font-size:clamp(34px,10vw,52px)">${winners.map(esc).join(' and ')} ${winners.length > 1 ? 'tie' : 'wins'}</h1>
    <p class="sub">Best liar and best lie detector in one.</p>
    ${errBox()}
    <div class="panel"><p class="big">Final scores</p>${scoreboard(false)}</div>
    ${S.isHost ? '<button id="again">Play again</button>' : '<p class="sub">Waiting for the host to start another game.</p>'}
    <button class="ghost small gap" id="leave">Leave room</button>`;
  const ag = document.getElementById('again'); if (ag) ag.onclick = () => act('again');
  document.getElementById('leave').onclick = leave;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
render();
poll(true);
setInterval(poll, 1500);
</script>
</body>
</html>
